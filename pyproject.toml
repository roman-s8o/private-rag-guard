[project]
name = "private-rag-guard"
version = "0.1.0"
description = "Local prompt-injection and answer-grounding checks for RAG, measured per language (EN/FR)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
laya = ["laya>=0.5.0"]

[project.scripts]
rag-guard-bench = "rag_guard.bench:main"
rag-guard-sets = "rag_guard.make_sets:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_guard"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
